name: Prepare next shuttle previews
on:
  push:
    branches: [stu100-next-three-shuttles-20261003]
    paths: [.github/workflows/prepare-next-shuttles.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stu100-next-three-shuttles-20261003
      - uses: actions/checkout@v6
        with:
          repository: yougoodhyh-byte/234
          ref: 5fbe99334958083fe1fd029a5e3fa6d6f089fac8
          path: .preview-tools
          sparse-checkout: scripts/update-shuttle-preview.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Apply exact display-only update
        run: |
          python3 .preview-tools/scripts/update-shuttle-preview.py
          node --check script.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css index.html
          git commit -m 'Show green next departure and smaller blue following departures in teaching shuttle cards'
          git push origin HEAD:stu100-next-three-shuttles-20261003
