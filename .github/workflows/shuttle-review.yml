name: Review shuttle changes
on:
  push:
    branches: [stu100-shuttle-parity-20261003]
    paths: [.github/workflows/shuttle-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stu100-shuttle-parity-20261003
      - name: Apply checked display-only edits
        run: |
          python3 scripts/update-shuttle.py
          node --check script.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js style.css
          git commit -m 'Match shuttle badges and default folding with Shantou 100'
          git push origin HEAD:stu100-shuttle-parity-20261003
