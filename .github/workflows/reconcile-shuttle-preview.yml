name: Preserve concurrent teaching edits
on:
  push:
    branches: [stu100-next-three-shuttles-20261003]
    paths: [.github/workflows/reconcile-shuttle-preview.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stu100-next-three-shuttles-20261003
          fetch-depth: 0
      - name: Merge only the reviewed independent pinyin edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          base='8ff2569b0c532189ddacc339daf6dfa9b54b9b9a'
          other='9e26b63b517e403dae7f914318351b0e6ba64490'
          def show(ref,name):return subprocess.check_output(['git','show',ref+':'+name],text=True)
          names=set(subprocess.check_output(['git','diff','--name-only',base,other],text=True).splitlines())
          assert names=={'script.js','style.css','index.html'}
          old=show(base,'script.js');new=show(other,'script.js');current=Path('script.js').read_text()
          start='function attendanceRandomNameHTML(name){';end='function attendanceMarkedTone(value){'
          oldpart=old[old.index(start):old.index(end)]
          newpart=new[new.index(start):new.index(end)]
          assert old.count(oldpart)==1 and old.replace(oldpart,newpart)==new
          assert current.count(oldpart)==1
          Path('script.js').write_text(current.replace(oldpart,newpart))
          oldcss=show(base,'style.css');newcss=show(other,'style.css');currentcss=Path('style.css').read_text()
          assert newcss.startswith(oldcss) and currentcss.startswith(oldcss)
          additions=currentcss[len(oldcss):]
          assert '/* Nearest departure (green)' in additions and '.attendance-random-tone' in newcss[len(oldcss):]
          Path('style.css').write_text(newcss+additions)
          def normalize(s):return re.sub(r'(\./(?:style\.css|script\.js))\?[^"\s]+',r'\1',s)
          otherhtml=show(other,'index.html');currenthtml=Path('index.html').read_text()
          assert normalize(show(base,'index.html'))==normalize(otherhtml)==normalize(currenthtml)
          Path('index.html').write_text(re.sub(r'(\./(?:style\.css|script\.js))\?[^"\s]+',r'\1?v=next-three-pinyin-20261003-1',otherhtml))
          print('Both the full-name pinyin update and tested shuttle preview are retained.')
          PY
          node --check script.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css index.html
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -p HEAD -p 9e26b63b517e403dae7f914318351b0e6ba64490 -m 'Preserve full-name pinyin changes alongside tested nearest/next-two shuttle previews')
          git push origin "$COMMIT":refs/heads/stu100-next-three-shuttles-20261003
